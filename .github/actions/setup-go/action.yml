name: Set up Go with workload caches
description: Keep test and packaging caches separate and refresh compiled packages when Go sources change.
inputs:
    workload:
        description: Cache workload (test or package)
        required: true
runs:
    using: composite
    steps:
        - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
          id: go
          with:
              go-version-file: go.mod
              cache: false

        - name: Locate Go caches
          id: paths
          shell: bash
          run: |
              echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
              echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
              echo "image=${ImageOS:-$RUNNER_OS}" >> "$GITHUB_OUTPUT"

        # A test job can otherwise claim the immutable cache before cross-platform packaging fills it.
        - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
          with:
              path: |
                  ${{ steps.paths.outputs.modules }}
                  ${{ steps.paths.outputs.build }}
              key: go-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.image }}-${{ steps.go.outputs.go-version }}-${{ inputs.workload }}-${{ hashFiles('go.mod', 'go.sum', 'Taskfile.yml', '.github/actions/setup-go/action.yml', '.github/workflows/ci.yml', '.github/workflows/release.yml') }}-${{ hashFiles('cmd/**', 'pkg/**') }}
              restore-keys: |
                  go-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.image }}-${{ steps.go.outputs.go-version }}-${{ inputs.workload }}-${{ hashFiles('go.mod', 'go.sum', 'Taskfile.yml', '.github/actions/setup-go/action.yml', '.github/workflows/ci.yml', '.github/workflows/release.yml') }}-
