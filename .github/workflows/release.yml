name: Release

# Push a version-matching tag to build, verify, and publish a GitHub Release.
#
# - Stable tags (vX.Y.Z) publish macOS and Linux arm64 + x64, and Windows x64. The macOS app is ad-hoc signed and not notarized
#   (no Apple Developer ID is configured), so users approve the first launch in Gatekeeper.
# - Windows x64 ships unsigned unless WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD are both configured.
#   Configured signing is required to succeed; partial credentials fail the build.
# - Linux ships AppImage (auto-update) and deb (manual update) on native Ubuntu runners.
# - workflow_dispatch defaults to a dry run; publish=true creates the tag after all checks pass.
on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            publish:
                description: Publish verified artifacts (main only)
                type: boolean
                default: false
            tag:
                description: Explicit version tag for publication (e.g. v1.6.0)
                type: string
                default: ""

permissions:
    contents: read

concurrency:
    group: release-${{ inputs.publish && inputs.tag || github.ref_name }}
    cancel-in-progress: false

env:
    NODE_VERSION: 22
    GO_VERSION_FILE: go.mod

jobs:
    preflight:
        name: Release preflight
        runs-on: ubuntu-latest
        timeout-minutes: 40
        outputs:
            tag: ${{ steps.plan.outputs.tag }}
            publish: ${{ steps.plan.outputs.publish }}
            createTag: ${{ steps.plan.outputs.createTag }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
              with:
                  go-version-file: ${{ env.GO_VERSION_FILE }}
                  cache-dependency-path: go.sum

            - name: Validate release plan
              id: plan
              run: node scripts/release-plan.mjs
              env:
                  INPUT_PUBLISH: ${{ inputs.publish }}
                  INPUT_TAG: ${{ inputs.tag }}

            - name: Force Git dependencies to HTTPS
              run: |
                  git config --global url.https://github.com/.insteadof ssh://git@github.com/
                  git config --global url.https://github.com/.insteadof git@github.com:

            - name: Install dependencies
              run: npm ci --no-audit --no-fund
              env:
                  GIT_ASKPASS: "echo"
                  GIT_TERMINAL_PROMPT: "0"

            # Same gate as CI (scripts/v1-gate.mjs is the single source of truth for the check list).
            - name: V1 gate
              run: node scripts/v1-gate.mjs

    build-macos:
        name: Build macOS (arm64 + x64)
        runs-on: macos-latest
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
              with:
                  go-version-file: ${{ env.GO_VERSION_FILE }}
                  cache-dependency-path: go.sum

            - name: Install Task
              uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Force Git dependencies to HTTPS
              run: |
                  git config --global url.https://github.com/.insteadof ssh://git@github.com/
                  git config --global url.https://github.com/.insteadof git@github.com:

            - name: Install dependencies
              run: npm ci --no-audit --no-fund
              env:
                  GIT_ASKPASS: "echo"
                  GIT_TERMINAL_PROMPT: "0"

            - name: Build and package macOS
              # `task package` builds wavesrv + wsh/genie + frontend, then runs electron-builder for arm64 and
              # x64 (zip + dmg). Publishing happens in a separate job after the builds are verified.
              run: task package -- --publish never
              env:
                  # The production vite bundle is large; the default ~2GB Node heap OOMs.
                  NODE_OPTIONS: "--max-old-space-size=6144"
                  # macOS code-signing env (CSC_LINK / APPLE_*) is intentionally NOT set here:
                  # an undefined secret expands to "", and electron-builder treats CSC_LINK=""
                  # as a cert path -> resolves to the repo root -> "<repo> not a file". Without
                  # CSC_LINK, electron-builder.config.cjs ad-hoc signs the bundle. To ship signed
                  # later, add a step that exports CSC_LINK / CSC_KEY_PASSWORD / APPLE_* only when
                  # those secrets are non-empty.

            - name: Verify macOS packages, signatures, and update metadata
              run: task package:verify -- make --require-arch arm64,x64

            - name: Launch packaged arm64 app (window smoke)
              run: node scripts/verify-installed-app.mjs --window-smoke make/mac-arm64/GenieTerm.app

            - name: Verify packaging left the checkout unchanged
              run: |
                  CHANGES="$(git status --porcelain --untracked-files=all)"
                  if [ -n "${CHANGES}" ]; then
                    echo "::error::Packaging modified the checkout, so the artifacts would not match ${GITHUB_SHA}"
                    echo "${CHANGES}"
                    git diff --stat
                    exit 1
                  fi

            - name: Upload package artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: genieterm-macos
                  if-no-files-found: error
                  path: |
                      make/*.dmg
                      make/*.zip
                      make/*.blockmap
                      make/*-mac.yml

    build-linux:
        name: Build Linux (${{ matrix.arch }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: x64
                      runner: ubuntu-22.04
                    - arch: arm64
                      runner: ubuntu-22.04-arm
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
              with:
                  go-version-file: ${{ env.GO_VERSION_FILE }}
                  cache-dependency-path: go.sum

            - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install Zig (glibc 2.28 CGO toolchain)
              uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
              with:
                  version: 0.13.0

            - name: Install Linux packaging and smoke dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y xvfb xauth libfuse2 libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 libsecret-1-0 libgbm1 libasound2 libatspi2.0-0 libuuid1 xdg-utils desktop-file-utils

            - name: Force Git dependencies to HTTPS
              run: |
                  git config --global url.https://github.com/.insteadof ssh://git@github.com/
                  git config --global url.https://github.com/.insteadof git@github.com:

            - name: Install dependencies
              run: npm ci --no-audit --no-fund
              env:
                  GIT_ASKPASS: "echo"
                  GIT_TERMINAL_PROMPT: "0"

            - name: Linux packaging verifier tests
              run: npm test -- --run scripts/linux-package.test.mjs

            - name: Build Linux AppImage and deb
              run: task package -- --linux --${{ matrix.arch }} --publish never
              env:
                  NODE_OPTIONS: "--max-old-space-size=6144"
                  GENIETERM_LINUX_TARGETS: AppImage,deb

            - name: Verify Linux packages and update metadata
              run: task package:verify -- make --require-arch ${{ matrix.arch }}

            - name: Launch extracted AppImage (window smoke)
              run: |
                  VERSION="$(node -p "require('./package.json').version")"
                  xvfb-run -a node scripts/verify-installed-app.mjs --window-smoke --linux-appimage "make/GenieTerm-linux-${{ matrix.arch }}-${VERSION}.AppImage"

            - name: Verify packaging left the checkout unchanged
              run: |
                  # setup-zig keeps its cache in the workspace; generated source changes must still fail.
                  CHANGES="$(git status --porcelain --untracked-files=all -- . ':(exclude).zig-cache')"
                  if [ -n "${CHANGES}" ]; then
                    echo "::error::Packaging modified the checkout, so the artifacts would not match ${GITHUB_SHA}"
                    echo "${CHANGES}"
                    git diff --stat
                    exit 1
                  fi

            - name: Upload Linux package artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: genieterm-linux-${{ matrix.arch }}
                  if-no-files-found: error
                  path: |
                      make/*.AppImage
                      make/*.deb
                      make/*.blockmap
                      make/*-linux*.yml

    build-windows:
        name: Build Windows x64
        runs-on: windows-latest
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
              with:
                  go-version-file: ${{ env.GO_VERSION_FILE }}
                  cache-dependency-path: go.sum

            - name: Install Task
              uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            # Windows wavesrv is cross-compiled with `zig cc` (see Taskfile build:server:windows).
            # setup-zig v2 still declares node20 (there is no node24 release yet); the runner executes it on node24.
            - name: Install Zig (CGO toolchain)
              uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
              with:
                  version: 0.13.0

            - name: Force Git dependencies to HTTPS
              run: |
                  git config --global url.https://github.com/.insteadof ssh://git@github.com/
                  git config --global url.https://github.com/.insteadof git@github.com:

            - name: Install dependencies
              run: npm ci --no-audit --no-fund
              env:
                  GIT_ASKPASS: "echo"
                  GIT_TERMINAL_PROMPT: "0"

            - name: Configure optional Windows signing
              id: signing
              shell: pwsh
              env:
                  WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
                  WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
              run: |
                  if ([bool]$env:WIN_CSC_LINK -ne [bool]$env:WIN_CSC_KEY_PASSWORD) {
                      throw "Configure both WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD, or leave both unset for an unsigned release."
                  }
                  $signingEnabled = ([bool]$env:WIN_CSC_LINK).ToString().ToLowerInvariant()
                  "enabled=$signingEnabled" >> $env:GITHUB_OUTPUT

            - name: Build unsigned Windows x64 release
              if: steps.signing.outputs.enabled != 'true'
              run: task package -- --win --x64
              env:
                  NODE_OPTIONS: "--max-old-space-size=6144"
                  CSC_IDENTITY_AUTO_DISCOVERY: "false"

            - name: Build signed Windows x64 release
              if: steps.signing.outputs.enabled == 'true'
              run: task package -- --win --x64
              env:
                  NODE_OPTIONS: "--max-old-space-size=6144"
                  GENIETERM_REQUIRE_WINDOWS_SIGNATURE: "1"
                  WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
                  WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

            - name: Verify Windows package artifact
              run: node scripts/verify-windows-package.mjs make --window-smoke --installer-smoke

            - name: Verify Windows release signatures
              if: steps.signing.outputs.enabled == 'true'
              run: node scripts/verify-windows-package.mjs make --require-signature

            - name: Verify packaging left the checkout unchanged
              shell: bash
              run: |
                  # setup-zig keeps its cache in the workspace (.zig-cache), which is not part of the source.
                  CHANGES="$(git status --porcelain --untracked-files=all -- . ':(exclude).zig-cache')"
                  if [ -n "${CHANGES}" ]; then
                    echo "::error::Packaging modified the checkout, so the artifacts would not match ${GITHUB_SHA}"
                    echo "${CHANGES}"
                    git diff --stat
                    exit 1
                  fi

            - name: Upload package artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: genieterm-windows
                  if-no-files-found: error
                  path: |
                      make/*.exe
                      make/*.zip
                      make/*.blockmap
                      make/alpha.yml
                      make/beta.yml
                      make/latest.yml

    linux-deb-ubuntu-2404:
        name: Linux deb on Ubuntu 24.04
        needs: build-linux
        # 24.04 restricts unprivileged user namespaces; the installed package must still run sandboxed
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Force Git dependencies to HTTPS
              run: |
                  git config --global url.https://github.com/.insteadof ssh://git@github.com/
                  git config --global url.https://github.com/.insteadof git@github.com:

            - name: Install dependencies
              run: npm ci --no-audit --no-fund
              env:
                  GIT_ASKPASS: "echo"
                  GIT_TERMINAL_PROMPT: "0"

            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: genieterm-linux-x64
                  path: linux-x64

            - name: Install the deb with apt
              run: |
                  sudo apt-get update
                  sudo apt-get install -y xvfb xauth desktop-file-utils
                  sudo apt-get install -y ./linux-x64/GenieTerm-linux-x64-*.deb

            - name: Check the PATH link, desktop entry and AppArmor profile
              run: |
                  sysctl kernel.apparmor_restrict_unprivileged_userns || true
                  test -x /opt/GenieTerm/genieterm
                  test "$(readlink -f /usr/bin/genieterm)" = /opt/GenieTerm/genieterm
                  VALIDATE="$(desktop-file-validate /usr/share/applications/genieterm.desktop 2>&1 || true)"
                  if [ -n "${VALIDATE}" ]; then echo "${VALIDATE}"; exit 1; fi
                  if [ -e /etc/apparmor.d/abi/4.0 ]; then
                    test -f /etc/apparmor.d/genieterm
                    sudo apparmor_parser --preprocess /etc/apparmor.d/genieterm > /dev/null
                  fi

            - name: Launch the installed app with the sandbox on
              run: xvfb-run -a node scripts/verify-installed-app.mjs --window-smoke --linux-installed /opt/GenieTerm

            - name: Remove the package and check cleanup
              run: |
                  sudo apt-get remove -y genieterm
                  test ! -e /usr/bin/genieterm
                  test ! -e /etc/apparmor.d/genieterm

    publish:
        name: Verify and publish GitHub Release
        needs: [preflight, build-macos, build-linux, linux-deb-ubuntu-2404, build-windows]
        # Every release must contain verified packages for all supported platforms.
        if: >-
            !cancelled() &&
            needs.preflight.result == 'success' &&
            needs.build-macos.result == 'success' &&
            needs.build-linux.result == 'success' &&
            needs.linux-deb-ubuntu-2404.result == 'success' &&
            needs.build-windows.result == 'success'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Force Git dependencies to HTTPS
              run: |
                  git config --global url.https://github.com/.insteadof ssh://git@github.com/
                  git config --global url.https://github.com/.insteadof git@github.com:

            - name: Install verification dependencies
              run: npm ci --ignore-scripts --no-audit --no-fund
              env:
                  GIT_ASKPASS: "echo"
                  GIT_TERMINAL_PROMPT: "0"

            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: genieterm-*
                  path: release-artifacts

            # Checks the exact asset set for every platform and every update manifest's
            # version, size, and sha512 against the payloads.
            - name: Verify release assets
              run: |
                  set -euo pipefail
                  node scripts/verify-release-assets.mjs release-artifacts --windows

            - name: Create or verify release tag
              if: needs.preflight.outputs.createTag == 'true'
              run: node scripts/ensure-release-tag.mjs
              env:
                  TAG_NAME: ${{ needs.preflight.outputs.tag }}

            - name: Publish release
              if: needs.preflight.outputs.publish == 'true'
              run: |
                  set -euo pipefail
                  mapfile -t ASSETS < <(find release-artifacts -type f | sort)
                  case "${TAG_NAME}" in
                    *-*) PUBLISH_FLAGS=(--prerelease --latest=false) ;;
                    *) PUBLISH_FLAGS=(--prerelease=false --latest) ;;
                  esac

                  if IS_DRAFT="$(gh release view "${TAG_NAME}" --json isDraft --jq .isDraft 2>/dev/null)"; then
                    if [ "${IS_DRAFT}" != "true" ]; then
                      echo "::error::Release ${TAG_NAME} is already published; refusing to replace its assets."
                      exit 1
                    fi
                    echo "Uploading to the existing draft release ${TAG_NAME}"
                    gh release upload "${TAG_NAME}" "${ASSETS[@]}" --clobber
                  else
                    NOTES_FLAGS=()
                    RELEASE_NOTES="docs/releases/${TAG_NAME}.md"
                    if [ -f "${RELEASE_NOTES}" ]; then
                      NOTES_FLAGS+=(--notes-file "${RELEASE_NOTES}")
                    else
                      NOTES_FLAGS+=(--generate-notes)
                    fi
                    gh release create "${TAG_NAME}" "${ASSETS[@]}" \
                      --draft \
                      --verify-tag \
                      --title "${TAG_NAME}" \
                      "${NOTES_FLAGS[@]}"
                  fi

                  EXPECTED="$(for ASSET in "${ASSETS[@]}"; do
                    printf '%s\t%s\tsha256:%s\n' "$(basename "${ASSET}")" "$(stat -c %s "${ASSET}")" "$(sha256sum "${ASSET}" | cut -d' ' -f1)"
                  done | sort)"
                  UPLOADED="$(gh release view "${TAG_NAME}" --json assets \
                    --jq '.assets[] | select(.state == "uploaded") | "\(.name)\t\(.size)\t\(.digest)"' | sort)"
                  if [ "${EXPECTED}" != "${UPLOADED}" ]; then
                    echo "::error::Draft release ${TAG_NAME} assets do not match the verified build artifacts."
                    diff <(echo "${EXPECTED}") <(echo "${UPLOADED}") || true
                    exit 1
                  fi

                  gh release edit "${TAG_NAME}" --draft=false "${PUBLISH_FLAGS[@]}"
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG_NAME: ${{ needs.preflight.outputs.tag }}
